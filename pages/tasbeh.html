<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasbeh Clicking</title>
    <link rel="stylesheet" href="../css/tasbeh.css">
    <link rel="shortcut icon" href="../img/tasbeh.png" type="image/x-icon">
</head>
<body>
    <div class="main">
        <div class="borders">
            <p class="name">SXH5136</p>
            <div class="view">
                <p class="click">0</p>
            </div>
            <div class="end">
                <button onclick="none()" class="reset">res</button>
            </div>
            <div class="center">
                <button onclick="inc()" class="btn">+</button>
            </div>
        </div>
    </div>

    <script src="../js/tasbeh.js"></script>
</body>
</html>
